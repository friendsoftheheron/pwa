<template id="map_template">
    <div id="map-${id}">
        <div class="title text-accent"><span class="${linear_class}">${_nr}</span>) ${title}</div>
        <div class="small">${adventure}</div>
    </div>
</template>
<input id="center_position" type="checkbox" />
<input id="tile-name" type="hidden" data-setting-default='{"light": "OpenStreetMap", "dark": "CartoDB DarkMatter"}'  />
<div id="leaflet"></div>
